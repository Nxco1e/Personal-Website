<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Neon Portfolio</title>
    <link rel="stylesheet" href="css">
    <style>
        body {
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            background: #18181f;
            margin: 0;
            color: #ffffff;
        }
        .container {
            max-width: 950px;
            margin: 40px auto;
            border-radius: 32px;
            box-shadow: 0 8px 32px rgba(0,255,255,0.10);
            background: #23232b;
            border: 2px solid #23232b;
            overflow: hidden;
        }
        header {
            background: #23232b;
            padding: 2.5rem 1rem 1.5rem 1rem;
            text-align: center;
            border-bottom: 2px solid #18181f;
        }
        .profile-pic {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.2rem;
        }
        .profile-pic img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #00fff7;
            box-shadow: 0 0 24px #00fff7, 0 0 8px #ff00ea inset;
            background: #23232b;
        }
        h1 {
            font-size: 2.2rem;
            color: #00fff7;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            font-weight: 700;
            text-shadow: 0 0 8px #00fff7, 0 0 2px #fff;
        }
        h2 {
            font-size: 1.2rem;
            color: #ff00ea;
            margin-bottom: 1.2rem;
            letter-spacing: 1px;
            font-weight: 600;
            text-shadow: 0 0 8px #ff00ea, 0 0 2px #fff;
        }
        nav {
            display: flex;
            justify-content: space-around;
            background: #18181f;
            border-top: 1px solid #23232b;
            padding: 1rem 0;
        }
        nav a {
            color: #00fff7;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            letter-spacing: 1px;
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
        }
        nav a:hover {
            background: #ff00ea;
            color: #18181f;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="profile-pic">
                <img src="Profile Picture.jpeg" alt="Profile Picture">
            </div>
            <h1>Nicole Shmerkin</h1>
            <h2>Personal Portfolio</h2>
            <h2> Bachelor's Of Science in Computer Science, May 2028</h2>
        </header>
        <nav>
            <a href="pages/about.html">About</a>
            <a href="pages/projects.html">Projects</a>
            <a href="pages/resume.html">Resume</a>
            <a href="pages/experience.html">Experience</a>
            <a href="pages/contact.html">Contact</a>
        </nav>
    </div>
</body>
</html>
